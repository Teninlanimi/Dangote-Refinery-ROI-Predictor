name: Ingest market data

# Pulls Brent, petrol, diesel and USD/NGN into the Neon database twice a day.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   DATABASE_URL   Neon connection string
#   FRED_API_KEY   free key from fred.stlouisfed.org
on:
  schedule:
    - cron: "5 6,18 * * *"     # 06:05 and 18:05 UTC (07:05 and 19:05 in Lagos)
  workflow_dispatch:            # "Run workflow" button for a manual run

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Run pipeline
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m pipeline.ingest
